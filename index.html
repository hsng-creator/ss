      <h1>給表哥的信</h1>
      <p>親愛的表哥：</p>
      <p>你好嗎？我很高興你將會於聖誕假期到香港旅遊。我已為你安排了兩天的行程。</p>
      <p>第一天早上，我們參觀香港國際機場，中午會到迪士尼樂園遊玩，晚上再經青馬大橋前往山頂觀光，欣賞香港美麗的夜景。</p>
      <p>第二天，我們首先到金紫荊廣場，然後去黃大仙廟。我們還可以到文化中心參觀藝術展覽！</p>
      <p>你喜歡這個安排嗎？希望你會有一個愉快的假期！</p>
      <p>祝</p>
      <p>學業進步！</p>
      <p>表弟　小強上</p>
      <p>十一月二十日</p>
